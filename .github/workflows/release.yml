# Publishes a new version with one click: Actions > Release > Run workflow.
#
# It bumps `version` in Cargo.toml (or keeps it with "current"), builds, commits the
# bump to the branch it runs on, tags it vX.Y.Z, packages installer/pencil.iss with
# Inno Setup and publishes PencilSetup.exe as a GitHub release.
# Installed copies pick it up the next time they start.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major, current]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Expressions are passed through `env:` and never pasted into the scripts, so
      # no input value can turn into code.
      - name: Compute version
        id: version
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          $current = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+)\.(\d+)\.(\d+)"').Matches[0]
          if (-not $current) { throw "No x.y.z version found in Cargo.toml" }
          [int]$major = $current.Groups[1].Value
          [int]$minor = $current.Groups[2].Value
          [int]$patch = $current.Groups[3].Value
          switch ($env:BUMP) {
            "major"   { $major++; $minor = 0; $patch = 0 }
            "minor"   { $minor++; $patch = 0 }
            "patch"   { $patch++ }
            "current" { }
          }
          $version = "$major.$minor.$patch"
          if (git ls-remote --tags origin "refs/tags/v$version") { throw "Tag v$version already exists" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Releasing v$version"

      - name: Set version in Cargo.toml
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          $toml = Get-Content Cargo.toml -Raw
          $toml = [regex]::Replace($toml, '(?m)^version = "[^"]+"', "version = `"$v`"", 1)
          [IO.File]::WriteAllText("$PWD\Cargo.toml", $toml)

      # Also refreshes this package's own entry in Cargo.lock; dependencies stay as locked.
      - name: Build
        run: cargo build --release

      # A fixed version from the official release, checked against its SHA-256
      # before it runs: never whatever a package feed serves that day.
      - name: Install Inno Setup
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
          INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest $env:INNO_URL -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup hash mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "inno"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -Wait
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup was not installed" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          & $env:ISCC "/DAppVersion=$env:VERSION" installer\pencil.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Only once everything is built, so a failure never leaves a tag without a release.
      - name: Commit and tag
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $v = $env:VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "chore: release v$v" }
          git tag "v$v"
          git push origin "HEAD:$env:BRANCH"
          git push origin "v$v"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$env:VERSION" installer/Output/PencilSetup.exe --title "Pencil v$env:VERSION" --generate-notes
